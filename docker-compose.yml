services:
  meowtrix:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify's proxy routes the domain to this port; no host port is published.
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
