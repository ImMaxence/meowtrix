map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  ~^/icons/   "public, max-age=604800";
  ~^/og/      "public, max-age=604800";
  default     "no-cache";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Behind Coolify's proxy: redirect /eau to /eau/ without naming this container's host and port.
  absolute_redirect off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json application/manifest+json application/xml image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "microphone=(self), fullscreen=(self), screen-wake-lock=(self)" always;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location = /llms.txt {
    default_type "text/plain; charset=utf-8";
  }

  # One page per theme, fête and language (/, /eau/, /en/water/…); anything else is a real 404,
  # so search engines don't see every made-up address as a copy of the home page.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
