map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  ~^/icons/   "public, max-age=604800";
  default     "no-cache";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "microphone=(self), fullscreen=(self), screen-wake-lock=(self)" always;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
