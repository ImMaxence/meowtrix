map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  ~^/icons/   "public, max-age=604800";
  ~^/og/      "public, max-age=604800";
  default     "no-cache";
}

# Assistants and agents asking for Markdown (Accept: text/markdown) get each page's index.md.
map $http_accept $wants_markdown {
  ~*text/markdown  1;
  default          0;
}

# A page answers in HTML or Markdown depending on Accept: caches must keep both apart.
map $uri $vary {
  ~/$                "Accept";
  ~/index\.(html|md)$  "Accept";
  default            "";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Behind Coolify's proxy: redirect /eau to /eau/ without naming this container's host and port.
  absolute_redirect off;

  charset utf-8;
  charset_types text/plain text/css text/xml text/markdown application/javascript application/json application/manifest+json;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/markdown application/javascript application/json application/manifest+json application/xml text/xml image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header Vary $vary always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "microphone=(self), fullscreen=(self), screen-wake-lock=(self)" always;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # The Markdown twin of each page (/en/index.md…), written by seo/markdown.ts.
  location ~ \.md$ {
    default_type text/markdown;
  }

  # One page per theme, fête and language (/, /eau/, /en/water/…); anything else is a real 404,
  # so search engines don't see every made-up address as a copy of the home page.
  location / {
    if ($wants_markdown) {
      rewrite ^(.*/)$ $1index.md last;
    }
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
