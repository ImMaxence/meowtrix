<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Meowtrix – des animaux en 3D à chasser pour votre chat, en plein écran : lézards, insectes, souris, oiseaux, poissons…" />
    <meta name="theme-color" content="#0f1412" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meowtrix" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Meowtrix</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main id="menu" class="menu">
      <div class="panel">
        <header class="panel-head">
          <div class="brand">
            <h1 class="logo">Meow<span>trix</span></h1>
            <p class="tagline" data-i18n="tagline"></p>
          </div>
          <div id="lang" class="lang"></div>
        </header>

        <nav id="themes" class="themes"></nav>
        <nav id="tabs" class="tabs"></nav>
        <div id="tab-panel" class="tab-panel" role="tabpanel"></div>

        <footer class="panel-foot">
          <p id="fatal" class="fatal" data-i18n="noWebgl" hidden></p>
          <button id="play" class="play" type="button"></button>
          <div class="foot-actions">
            <button id="exit-fs" class="ghost" type="button" data-i18n="exitFullscreen" hidden></button>
            <button id="install" class="ghost" type="button" data-i18n="install" hidden></button>
          </div>
          <p id="install-hint" class="note" data-i18n="installIos" hidden></p>
          <p class="note" data-i18n="safety"></p>
          <p id="version" class="version"></p>
        </footer>
      </div>
    </main>

    <button id="hold" class="hold" type="button" data-i18n-aria="holdLabel" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle class="track" cx="24" cy="24" r="21" />
        <circle class="progress" cx="24" cy="24" r="21" />
        <!-- A finger pressing down: hold to open the menu. -->
        <g class="hand" transform="translate(-1.5 0)">
          <path d="M17 13.5a4.5 4.5 0 0 1 8.5 0M13.7 12.5a8 8 0 0 1 15.1 0" />
          <path d="M19 27V15.25a2.25 2.25 0 0 1 4.5 0V23a2 2 0 0 1 4 0v1a1.9 1.9 0 0 1 3.8 0v1.5a1.7 1.7 0 0 1 3.4 0V30c0 4-3 7-7 7h-3c-2.5 0-4-1.2-5.2-3l-3.6-4.6a1.9 1.9 0 0 1 3.1-2.3z" />
        </g>
      </svg>
    </button>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
