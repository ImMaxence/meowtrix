<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Title, description, links between languages, previews and structured data: filled per page by seo/plugin.ts. -->
    <!-- seo:head -->
    <meta name="theme-color" content="#0f1412" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meowtrix" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main id="menu" class="menu">
      <div class="panel">
        <header class="panel-head">
          <div class="brand">
            <h1 class="logo">Meow<span>trix</span></h1>
            <p class="tagline" data-i18n="tagline"><!-- seo:tagline --></p>
          </div>
          <div id="lang" class="lang"></div>
        </header>

        <div id="summary" class="summary" role="status" hidden></div>
        <nav id="themes" class="themes"></nav>
        <nav id="fetes" class="fetes"></nav>
        <nav id="tabs" class="tabs"></nav>
        <div id="tab-panel" class="tab-panel" role="tabpanel"></div>
        <article id="about" class="tab-panel about" role="tabpanel" hidden>
          <!-- seo:about -->
        </article>

        <footer class="panel-foot">
          <p id="fatal" class="fatal" data-i18n="noWebgl" hidden></p>
          <div class="stats-row">
            <p id="stats" class="stats" aria-live="polite" hidden></p>
            <button id="share" class="share" type="button" data-i18n="share"></button>
          </div>
          <button id="play" class="play" type="button"></button>
          <div class="foot-actions">
            <button id="exit-fs" class="ghost" type="button" data-i18n="exitFullscreen" hidden></button>
            <button id="install" class="ghost" type="button" data-i18n="install" hidden></button>
          </div>
          <p id="install-hint" class="note" data-i18n="installIos" hidden></p>
          <p class="note" data-i18n="safety"></p>
          <div class="foot-links">
            <a id="github" class="gh-link" target="_blank" rel="noopener" data-i18n-aria="github">
              <!-- GitHub mark (Octicons, MIT). -->
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
              </svg>
            </a>
            <span id="version" class="version"></span>
            <a id="report" class="report-link" target="_blank" rel="noopener" data-i18n="report"></a>
          </div>
        </footer>
      </div>
    </main>

    <button id="hold" class="hold" type="button" data-i18n-aria="holdLabel" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle class="track" cx="24" cy="24" r="21" />
        <circle class="progress" cx="24" cy="24" r="21" />
        <!-- A finger pressing down: hold to open the menu. -->
        <g class="hand" transform="translate(-1.5 0)">
          <path d="M17 13.5a4.5 4.5 0 0 1 8.5 0M13.7 12.5a8 8 0 0 1 15.1 0" />
          <path d="M19 27V15.25a2.25 2.25 0 0 1 4.5 0V23a2 2 0 0 1 4 0v1a1.9 1.9 0 0 1 3.8 0v1.5a1.7 1.7 0 0 1 3.4 0V30c0 4-3 7-7 7h-3c-2.5 0-4-1.2-5.2-3l-3.6-4.6a1.9 1.9 0 0 1 3.1-2.3z" />
        </g>
      </svg>
    </button>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
